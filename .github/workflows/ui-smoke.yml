name: UI Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    name: Xcode UI smoke tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes

      - name: List Xcode project
        run: xcodebuild -list -project EasyNote.xcodeproj

      - name: Select iPhone simulator
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys

          devices = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          ).get("devices", {})

          selected = None
          for runtime in sorted(devices):
              for device in devices[runtime]:
                  if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone"):
                      selected = device
                      break
              if selected:
                  break

          if not selected:
              print("No available iPhone simulator found", file=sys.stderr)
              sys.exit(1)

          print(f"Selected simulator: {selected['name']} ({selected['udid']})")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SIMULATOR_UDID={selected['udid']}\n")
          PY

      - name: Run UI smoke tests
        run: |
          xcodebuild test \
            -project EasyNote.xcodeproj \
            -scheme EasyNote \
            -only-testing:EasyNoteUITests/EasyNoteUITests/testLaunches \
            -only-testing:EasyNoteUITests/EasyNoteUITests/testPrimaryTabNavigationSmoke \
            -destination "id=${SIMULATOR_UDID}" \
            CODE_SIGNING_ALLOWED=NO
